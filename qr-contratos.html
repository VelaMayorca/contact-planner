<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR – Contratos Vela Mayorca</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:#fff;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.12);padding:36px 40px;text-align:center;max-width:340px;width:100%;}
  .logo{font-size:1.5rem;font-weight:800;color:#1d4ed8;letter-spacing:-0.03em;margin-bottom:4px;}
  .logo span{color:#0ea5e9;}
  .subtitle{font-size:0.82rem;color:#6b7280;margin-bottom:24px;letter-spacing:0.03em;text-transform:uppercase;}
  #qrcode{display:flex;justify-content:center;margin-bottom:20px;}
  #qrcode canvas,#qrcode img{border-radius:10px;border:3px solid #e0e7ff;}
  .url-label{font-size:0.7rem;color:#9ca3af;word-break:break-all;margin-bottom:20px;padding:8px 12px;background:#f8fafc;border-radius:8px;border:1px solid #e5e7eb;}
  .instruction{font-size:0.82rem;color:#374151;line-height:1.5;margin-bottom:20px;padding:12px 14px;background:#eff6ff;border-radius:10px;border-left:3px solid #1d4ed8;}
  .print-btn{background:#1d4ed8;color:#fff;border:none;border-radius:10px;padding:11px 24px;font-size:0.9rem;font-weight:700;cursor:pointer;width:100%;}
  .print-btn:hover{background:#1e40af;}
  @media print{
    body{background:#fff;}
    .card{box-shadow:none;padding:0;}
    .print-btn{display:none;}
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Vela <span>Mayorca</span></div>
  <div class="subtitle">⛵ Contratos de excursión</div>
  <div id="qrcode"></div>
  <div class="url-label" id="urlLabel"></div>
  <div class="instruction">📱 Escanea con el móvil para abrir directamente la vista de <strong>Contratos</strong> y generar el documento con firma.</div>
  <button class="print-btn" onclick="window.print()">🖨️ Imprimir QR</button>
</div>
<script>
  const url = "https://velamayorca.github.io/contact-planner/vela-tours-planning.html?view=contratos";
  document.getElementById('urlLabel').textContent = url;
  new QRCode(document.getElementById('qrcode'), {
    text: url,
    width: 240,
    height: 240,
    colorDark: "#1d4ed8",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
</script>
</body>
</html>
